# NPM 下载量统计：每天统计一次，结果推送到企业微信机器人。
# 依赖仓库 secret：WX_ROBOT_KEY（企业微信机器人 key）
name: NPM Download Statistics

on:
  schedule:
    # UTC 1:00 = 北京时间 9:00，每天一次
    - cron: '0 1 * * *'
  # 手动触发，方便临时统计或验证
  workflow_dispatch:

jobs:
  npm-stats:
    name: 统计 NPM 下载量
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 准备 pnpm 10
        uses: pnpm/action-setup@v4
        with:
          # 与 build-demo.yml / fetch.yml 保持一致：
          # pnpm-workspace.yaml 里的 allowBuilds 是 pnpm 10 的配置，9 不认识
          version: 10

      - name: 准备 Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 脚本内部读取 WX_ROBOT_KEY 推送结果；未配置该 secret 时脚本会自行处理
      - name: 统计下载量并推送企业微信
        env:
          WX_ROBOT_KEY: ${{ secrets.WX_ROBOT_KEY }}
        run: node scripts/npm-stats/npm-download-stats.js
