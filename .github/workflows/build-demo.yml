name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'scripts/**'
      - 'README.md'
      - '.gitignore'

# 设置 GITHUB_TOKEN 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      # ---- notes（VitePress 文档站，仓库根）----
      - name: Install notes deps
        run: pnpm install --frozen-lockfile

      - name: notes extra install
        run: pnpm run extra:install

      - name: Build notes
        run: pnpm run docs:build

      # ---- one（Vue3 子应用，one/ 目录）----
      - name: Install one deps
        run: cd one && pnpm install --no-frozen-lockfile

      - name: one extra install
        run: cd one && pnpm run extra:install

      - name: Build one
        # 内部会先跑 merge:one（合并 历史基线 + 每期增量 → one-data.json）
        run: cd one && pnpm run build

      # ---- 合并产物：one 挂到 /notes/one/ ----
      # notes base=/notes/，one base=/notes/one/，
      # 因此把 one/dist 放进 .vitepress/dist/one 即对应 URL /notes/one/
      - name: Merge artifacts
        # 注意：必须先 mkdir 再用 `one/dist/.` 复制「目录内容」。
        # 直接 `cp -r one/dist .vitepress/dist/one` 在目标已存在时（VitePress 若
        # 扫到 one 下的 md 会先建出 one/ 目录）会嵌套成 one/dist/，页面就 404 了。
        run: |
          mkdir -p .vitepress/dist/one
          cp -r one/dist/. .vitepress/dist/one/
          ls .vitepress/dist/one

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
