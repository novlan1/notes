name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'scripts/**'
      - 'README.md'
      - '.gitignore'

# 设置 GITHUB_TOKEN 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 必须与本地（10.17.1）保持一致：
          # pnpm-workspace.yaml 里的 allowBuilds 是 pnpm 10 的配置，pnpm 9 不认识；
          # 且 pnpm-lock.yaml 现在由 pnpm 10 生成
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      # ---- 统一安装：workspace 根（notes）+ 所有子包（含 one）----
      # pnpm-workspace.yaml 声明 packages: ['one']，
      # 一次 install 搞定 notes 和 one 的依赖，共用根 pnpm-lock.yaml
      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: notes extra install
        run: pnpm run extra:install

      - name: Build notes (VitePress)
        run: pnpm run docs:build

      # ---- one（Vue3 子应用，workspace 子包）----
      - name: one extra install
        run: pnpm --filter one run extra:install

      - name: Build one
        # 前端直接 import 已入库的 one-data.json，构建时无需合并步骤
        run: pnpm --filter one run build

      # ---- 合并产物：one 挂到 /notes/one/ ----
      # notes base=/notes/，one base=/notes/one/，
      # 因此把 one/dist 放进 .vitepress/dist/one 即对应 URL /notes/one/
      - name: Merge artifacts
        # 注意：必须先 mkdir 再用 `one/dist/.` 复制「目录内容」。
        # 直接 `cp -r one/dist .vitepress/dist/one` 在目标已存在时（VitePress 若
        # 扫到 one 下的 md 会先建出 one/ 目录）会嵌套成 one/dist/，页面就 404 了。
        run: |
          mkdir -p .vitepress/dist/one
          cp -r one/dist/. .vitepress/dist/one/
          ls .vitepress/dist/one

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
