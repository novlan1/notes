name: 'Fetch One Data'

# 定时抓取 ONE 的下一期 → 直接上传到 COS/CDN。
#
# 数据不再进 git，带来两个好处：
#   1. .git 不会因每期重写 1.4MB 的 json 而膨胀；
#   2. 不必为了 100 字节的新数据重跑一次 VitePress 全站构建（约 2m41s），
#      前端运行时直接从 CDN 拉最新数据，更新即刻生效。
#
# 需要的 Secrets（仓库 Settings → Secrets and variables → Actions）：
#   COS_SECRET_ID / COS_SECRET_KEY
#
# 桶名（mike-1255355338）、地域（ap-guangzhou）、对象路径（one/one-data.json）
# 都是公开信息，直接写在 one/script/upload-one-data.js 里，不必配成 Secrets。

on:
  schedule:
    # UTC 0,4,6,23 点 = 北京时间 8,12,14,7 点
    - cron: '0 0,4,6,23 * * *'
  # 方便手动触发验证 / 补抓
  workflow_dispatch:

jobs:
  fetch:
    name: 抓取并上传 ONE 数据
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 准备 pnpm 10
        uses: pnpm/action-setup@v4
        with:
          # 与 build-demo.yml 保持一致（allowBuilds 是 pnpm 10 的配置）
          version: 10

      - name: 准备 Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖（workspace）
        run: pnpm install --frozen-lockfile

      # 这里不跑 extra:install：那批 @latest 依赖（plugin-light、press-* 等）
      # 是构建用的，抓数据只要 axios / cheerio / t-comm（都在 dependencies 里）
      - name: 抓取 ONE 最新一期
        # 数据源偶尔抽风/被限流时，不让定时任务天天报错刷屏；
        # 没抓到也只是把现有数据重新上传一次，没有副作用
        continue-on-error: true
        run: pnpm --filter one run fetch:new

      - name: 上传到 COS（CDN 源站）
        # 桶名/地域/路径已写死在脚本里，这里只需要密钥
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: pnpm --filter one run upload:data
