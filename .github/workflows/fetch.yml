name: 'Fetch One Data'

# 定时抓取 ONE 的下一期 → 直接上传到 COS/CDN。
#
# 数据不再进 git，带来两个好处：
#   1. .git 不会因每期重写 1.4MB 的 json 而膨胀；
#   2. 不必为了 100 字节的新数据重跑一次 VitePress 全站构建（约 2m41s），
#      前端运行时直接从 CDN 拉最新数据，更新即刻生效。
#
# 需要的 Secrets（仓库 Settings → Secrets and variables → Actions）：
#   COS_SECRET_ID / COS_SECRET_KEY / COS_BUCKET / COS_REGION
#   COS_KEY（可选，默认 one/one-data.json）
#   COS_CDN_URL（可选，仅用于日志提示）

on:
  schedule:
    # UTC 0,4,6,23 点 = 北京时间 8,12,14,7 点
    - cron: '0 0,4,6,23 * * *'
  # 方便手动触发验证 / 补抓
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与 build-demo.yml 保持一致（allowBuilds 是 pnpm 10 的配置）
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: Extra install
        run: pnpm --filter one run extra:install

      - name: Fetch new data
        # 数据源偶尔抽风/被限流时，不让定时任务天天报错刷屏；
        # 没抓到也只是把现有数据重新上传一次，没有副作用
        continue-on-error: true
        run: pnpm --filter one run fetch:new

      - name: Upload to COS (CDN)
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          COS_KEY: ${{ secrets.COS_KEY }}
          COS_CDN_URL: ${{ secrets.COS_CDN_URL }}
        run: pnpm --filter one run upload:data
