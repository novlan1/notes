name: 'Fetch One Data'

# 从旧仓库 novlan1/one 迁移过来，沿用它的方案：
# 定时抓取 ONE 的下一期，读改写 one/src/logic/config/one-data.json 并提交。
# 前端 src/logic/one/get-data.ts 直接 import 这个文件，构建时不需要合并步骤。
#
# 体积提示：one-data.json 约 1.4MB，每有更新就整体重写提交，约 456MB/年。
# 旧仓库 .git 涨到 3.5G 的主因是历史图片（4582 张共 1.8G，占 69.9%），
# json 只占 24%；图片没有迁过来，所以这边只会有 json 这一项的增长。

on:
  schedule:
    # UTC 0,4,6,23 点 = 北京时间 8,12,14,7 点
    - cron: '0 0,4,6,23 * * *'
  # 方便手动触发验证 / 补抓
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 不走默认的 GITHUB_TOKEN，下面用 PAT 推送
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与 build-demo.yml 保持一致（allowBuilds 是 pnpm 10 的配置）
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps (workspace)
        run: pnpm install --frozen-lockfile

      - name: Extra install
        run: pnpm --filter one run extra:install

      - name: Fetch new data
        # 数据源偶尔抽风/被限流时，不让定时任务天天报错刷屏；
        # 没抓到自然就没有 diff，下面会跳过提交，站点继续用基线构建
        continue-on-error: true
        run: pnpm --filter one run fetch:new

      - name: Check for changes
        id: check
        run: |
          git add one/src/logic/config/one-data.json
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo ">>> 没有新数据，跳过提交"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo ">>> 有新数据，准备提交"
          fi

      - name: Commit and push
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name 'novlan1'
          git config user.email '1576271227@qq.com'
          git commit -m "feat: fetch new one data $(TZ=':Asia/Shanghai' date '+%Y-%m-%d %T')"
          # 必须用 PAT：GITHUB_TOKEN 触发的 push 不会再触发其他 workflow，
          # 那样数据更新了但不会重新部署。
          # 推送到 master 会命中 build-demo.yml（数据文件不在 paths-ignore 里），
          # 自动带上新数据重新部署。
          git push "https://x-access-token:${{ secrets.ACCESS_TOKEN }}@github.com/novlan1/notes.git" HEAD:master
